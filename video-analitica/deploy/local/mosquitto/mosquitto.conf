# Mosquitto 2.0.18 del local.
# Escucha solo dentro de la red de Docker (el compose no publica el puerto),
# por eso se permite conexión anónima: lo ven Frigate y el conector, nadie más.
# Si algún día se publica el puerto, agregar password_file y allow_anonymous false.
listener 1883 0.0.0.0
allow_anonymous true
persistence false
log_dest stdout
log_type error
log_type warning
